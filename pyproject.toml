[project]
name = "fqa"
version = "1.0.0"
description = "Face Quality Assessment and intelligent sorting for ArcFace clusters"
requires-python = ">=3.10"
dependencies = [
"numpy>=1.24", "opencv-python>=4.8", "mediapipe>=0.10",
"fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.5",
]

[project.optional-dependencies]
crfiqa = ["torch>=2.1", "torchvision>=0.16"]
arcface = ["onnxruntime>=1.17"]
dev = ["pytest>=7.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fqa*"]